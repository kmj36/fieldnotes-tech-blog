openapi: 3.0.3
info:
  title: Fieldnotes Blog API
  version: 1.0.0
  description: 블로그 사용자/관리자 API v1

servers:
  - url: http://{SERVER_URL}:8080/
    variables:
      SERVER_URL:
        default: localhost

tags:
  - name: Healthcheck
  - name: Public
  - name: Admin

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    OK:
      description: 성공
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonResponse'

    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            code: "E404_001"
            detail: "resource not found."
            message: "요청한 리소스를 찾을 수 없습니다."
            timestamp: "2025-12-26T01:34:00+09:00"
            path: "/api/v1/..."

    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            code: "E400_002"
            detail: "'AccountID' does not satisfy 'required' condition"
            message: "요청 파라미터의 타입 또는 형식이 올바르지 않습니다."
            timestamp: "2026-05-05T11:40:38.485176711Z"
            path: "/api/v1/..."

    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 401
            code: "E401_001"
            detail: "Invalid admin credentials."
            message: "인증에 실패하였습니다."
            timestamp: "2025-12-26T01:34:00+09:00"
            path: "/api/v1/..."

    Conflict:
      description: 리소스 중복
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 409
            code: "E409_001"
            detail: "resource already exists."
            message: "서버의 현재 상태와 요청이 충돌하였습니다."
            timestamp: "2025-12-26T01:34:00+09:00"
            path: "/api/v1/..."

    InternalServerError:
      description: 서버 내부 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 500
            code: "E500_001"
            detail: "failed to encode args[0]..."
            message: "서버 내부 에러가 발생하였습니다."
            timestamp: "2026-05-06T02:57:20.333687031Z"
            path: "/api/v1/..."

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: integer

    PathAccount:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        default: testAccount1
      description: 관리자 계정 ID

    QueryPage:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1

    QueryPageLimit:
      name: pageLimit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 8

    QueryPostId:
      name: id
      in: query
      schema:
        type: integer
        minimum: 1

    QueryAccountId:
      name: accountId
      in: query
      schema:
        type: string
        maxLength: 255

    QueryNickname:
      name: nickname
      in: query
      schema:
        type: string
        maxLength: 255

    QueryMatchType:
      name: matchType
      in: query
      schema:
        type: string
        enum: [equal, prefix, suffix, contains]
      description: slug/title 검색 방식 (slug 또는 title 사용 시 기본값 equal)

    QuerySlug:
      name: slug
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 150

    QueryTitle:
      name: title
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 100

    QueryCategoryId:
      name: categoryId
      in: query
      schema:
        type: integer
        format: int16
        minimum: 1

    QueryTagSlugs:
      name: tagSlugs
      in: query
      schema:
        type: array
        items:
          type: string
        maxItems: 50
      style: form
      explode: false

    QueryPostSortBy:
      name: sortBy
      in: query
      schema:
        type: string
        enum: [id, created_at, updated_at, published_at, title, slug]
        default: created_at

    QuerySortDir:
      name: sortDir
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc

    QueryDateFilter:
      name: dateFilter
      in: query
      schema:
        type: string
        enum: [eq, gt, lt, gte, lte, between]
      description: 날짜 비교 연산자. dateTarget/dateFrom과 함께 사용 (기본값 eq)

    QueryDateTarget:
      name: dateTarget
      in: query
      schema:
        type: string
        enum: [created_at, updated_at, published_at]
      description: 날짜 필터 대상 컬럼

    QueryDateFrom:
      name: dateFrom
      in: query
      schema:
        type: string
        format: date
      description: 날짜 필터 시작값 (YYYY-MM-DD)

    QueryDateTo:
      name: dateTo
      in: query
      schema:
        type: string
        format: date
      description: dateFilter=between 일 때 종료 날짜 (YYYY-MM-DD)

  schemas:
    CommonResponse:
      type: object
      required: [status, code, detail, message, timestamp, path]
      properties:
        status:
          type: integer
          example: 200
        code:
          type: string
          example: "E200_001"
        detail:
          type: string
          example: "Successfully retrieved."
        message:
          type: string
          example: "정상적으로 처리되었습니다."
        timestamp:
          type: string
          format: date-time
          example: "2026-01-20T16:31:00+09:00"
        path:
          type: string
          example: "/api/v1/post"

    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/CommonResponse'

    Pagination:
      type: object
      required: [page, pageLimit, total, totalPages, hasNextPage, hasPrevPage]
      properties:
        page:
          type: integer
          example: 1
        pageLimit:
          type: integer
          example: 8
        total:
          type: integer
          example: 3
        totalPages:
          type: integer
          example: 1
        hasNextPage:
          type: boolean
        hasPrevPage:
          type: boolean

    Sort:
      type: object
      required: [by, dir]
      properties:
        by:
          type: string
          example: "created_at"
        dir:
          type: string
          enum: [asc, desc]
          example: "desc"

    Diff:
      type: object
      required: [changed_fields]
      properties:
        changed_fields:
          type: array
          items:
            type: string
          example: ["name", "slug"]

    TagPublic:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: "태그1"
        slug:
          type: string
          example: "tag-1"

    TagDetail:
      type: object
      required: [id, name, slug, createdAt, updatedAt]
      properties:
        id:
          type: integer
          example: 12
        name:
          type: string
          example: "태그 12"
        slug:
          type: string
          example: "tag-12"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CategoryPublic:
      type: object
      required: [id, parentId, name, slug, path]
      nullable: true
      properties:
        id:
          type: integer
          example: 2
        parentId:
          type: integer
          nullable: true
          example: 1
        name:
          type: string
          example: "개발"
        slug:
          type: string
          example: "development"
        path:
          type: string
          example: "/tech/frontend"

    CategoryDetail:
      type: object
      required: [id, parentId, name, slug, path, createdAt, updatedAt]
      properties:
        id:
          type: integer
          example: 5
        parentId:
          type: integer
          nullable: true
          example: 2
        name:
          type: string
          example: "C++"
        slug:
          type: string
          example: "cpp"
        path:
          type: string
          example: "/cpp"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PostPublic:
      type: object
      required: [id, nickname, slug, title, excerpt, thumbnail, publishedAt, updatedAt, category, tags]
      properties:
        id:
          type: integer
          example: 7
        nickname:
          type: string
          example: "admin"
        slug:
          type: string
          example: "go_learning_1"
        title:
          type: string
          example: "GORM 이란?"
        excerpt:
          type: string
          example: "GORM은 Go 언어에서 사용하는 ORM..."
        thumbnail:
          type: string
          nullable: true
          example: "https://example.com/thumbnail.png"
        publishedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
        category:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CategoryPublic'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagPublic'

    PostDetail:
      allOf:
        - $ref: '#/components/schemas/PostPublic'
        - type: object
          properties:
            content:
              type: string
            createdAt:
              type: string
              format: date-time
              nullable: true
            isPrivate:
              type: boolean
              nullable: true

    PostSummaryPublic:
      type: object
      required: [id, nickname, slug, title, excerpt, thumbnail, updatedAt, category, tags]
      properties:
        id:
          type: integer
          example: 1
        nickname:
          type: string
          example: "admin"
        slug:
          type: string
          example: "example-my-blog-1"
        title:
          type: string
          example: "제목1"
        excerpt:
          type: string
          example: "내용 요약 1"
        thumbnail:
          type: string
          nullable: true
          example: "https://img.example.com/test.png"
        publishedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
        category:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CategoryPublic'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagPublic'

    PostDetailPublic:
      type: object
      required: [id, nickname, slug, title, content, thumbnail, updatedAt, category, tags]
      properties:
        id:
          type: integer
        nickname:
          type: string
        slug:
          type: string
        title:
          type: string
        content:
          type: string
        thumbnail:
          type: string
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
        category:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CategoryPublic'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagPublic'

    PostSummaryAdmin:
      allOf:
        - $ref: '#/components/schemas/PostSummaryPublic'
        - type: object
          required: [isPrivate]
          properties:
            accountId:
              type: string
              example: "admin"
            createdAt:
              type: string
              format: date-time
            category:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/CategoryDetail'
            isPrivate:
              type: boolean

    PostDetailAdmin:
      type: object
      required: [id, nickname, slug, title, content, thumbnail, updatedAt, isPrivate, category, tags]
      properties:
        id:
          type: integer
        nickname:
          type: string
        slug:
          type: string
        title:
          type: string
        content:
          type: string
        thumbnail:
          type: string
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
        isPrivate:
          type: boolean
        category:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CategoryDetail'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagPublic'

    AccountDetail:
      type: object
      required: [id, accountId, nickname, avatarUrl, role, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
          example: 5
        accountId:
          type: string
          example: "admin"
        nickname:
          type: string
          example: "admin"
        avatarUrl:
          type: string
          example: "https://www.svgrepo.com/show/345423/admin.svg"
        role:
          type: string
          example: "ADMIN"
        status:
          type: string
          example: "ACTIVE"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AccountPublic:
      type: object
      required: [id, accountId, role]
      properties:
        id:
          type: integer
          example: 5
        accountId:
          type: string
          example: "admin"
        nickname:
          type: string
          example: "관리자"
        avatarUrl:
          type: string
          example: "https://example.com/avatar.png"
        role:
          type: string
          example: "ADMIN"
        status:
          type: string
          example: "ACTIVE"

paths:

  /api/v1/health:
    get:
      tags: [Healthcheck]
      summary: 서버 헬스체크
      operationId: healthCheck
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: "OK"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/post:
    get:
      tags: [Public]
      summary: 게시물 목록 조회
      operationId: getPosts
      parameters:
        - $ref: '#/components/parameters/QueryPage'
        - $ref: '#/components/parameters/QueryPageLimit'
        - $ref: '#/components/parameters/QueryPostSortBy'
        - $ref: '#/components/parameters/QuerySortDir'
        - $ref: '#/components/parameters/QueryPostId'
        - $ref: '#/components/parameters/QueryNickname'
        - $ref: '#/components/parameters/QueryMatchType'
        - $ref: '#/components/parameters/QuerySlug'
        - $ref: '#/components/parameters/QueryTitle'
        - $ref: '#/components/parameters/QueryCategoryId'
        - $ref: '#/components/parameters/QueryTagSlugs'
        - $ref: '#/components/parameters/QueryDateFilter'
        - $ref: '#/components/parameters/QueryDateTarget'
        - $ref: '#/components/parameters/QueryDateFrom'
        - $ref: '#/components/parameters/QueryDateTo'
      responses:
        '200':
          description: 게시물 목록 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      result:
                        type: object
                        properties:
                          meta:
                            type: object
                            properties:
                              pagination:
                                $ref: '#/components/schemas/Pagination'
                              sort:
                                $ref: '#/components/schemas/Sort'
                              filter:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    nullable: true
                                  nickname:
                                    type: string
                                    nullable: true
                                  matchType:
                                    type: string
                                    nullable: true
                                  slug:
                                    type: string
                                    nullable: true
                                  title:
                                    type: string
                                    nullable: true
                                  categoryId:
                                    type: integer
                                    nullable: true
                                  tagSlugs:
                                    type: array
                                    nullable: true
                                    items:
                                      type: string
                                  dateFilter:
                                    type: string
                                    nullable: true
                                  dateTarget:
                                    type: string
                                    nullable: true
                                  dateFrom:
                                    type: string
                                    format: date
                                    nullable: true
                                  dateTo:
                                    type: string
                                    format: date
                                    nullable: true
                          data:
                            type: array
                            items:
                              $ref: '#/components/schemas/PostSummaryPublic'
              example:
                status: 200
                code: "E200_001"
                detail: "Successfully retrieved 3 posts."
                message: "정상적으로 처리되었습니다."
                timestamp: "2026-05-15T08:59:13.184518021Z"
                path: "/api/v1/post"
                result:
                  meta:
                    pagination:
                      page: 1
                      pageLimit: 3
                      total: 12
                      totalPages: 4
                      hasNextPage: true
                      hasPrevPage: false
                    sort:
                      by: "created_at"
                      dir: "desc"
                    filter:
                      id: null
                      nickname: null
                      matchType: null
                      slug: null
                      title: null
                      categoryId: null
                      tagSlugs: null
                      dateFilter: null
                      dateTarget: null
                      dateFrom: null
                      dateTo: null
                  data:
                    - id: 15
                      nickname: "admin"
                      slug: "go_learning_102"
                      title: "GORM 이란?"
                      excerpt: "GORM은 Go 언어에서 사용하는 ORM(Object Relational Mapping) 라이브러리입니다. SQL 쿼리를 직접 작성하지 않고도 Go 구조체를 통해 데이터베이스를 조작할 수 있습니다."
                      thumbnail: "https://example.com/thumbnail.png"
                      publishedAt: "2026-05-15T13:39:17.098501+09:00"
                      updatedAt: "2026-05-15T13:39:17.099659+09:00"
                      category:
                        id: 13
                        parentId: 5
                        path: "/tech/backend/go"
                        name: "Go"
                        slug: "go"
                      tags:
                        - id: 9
                          name: "독서"
                          slug: "reading"
                    - id: 14
                      nickname: "admin"
                      slug: "go_learning_10"
                      title: "GORM 이란?"
                      excerpt: "GORM"
                      thumbnail: "https://example.com/thumbnail.png"
                      publishedAt: "2026-05-13T15:11:55.953764+09:00"
                      updatedAt: "2026-05-13T15:11:55.95477+09:00"
                      category: null
                      tags: []
                    - id: 13
                      nickname: "admin"
                      slug: "go_learning_7"
                      title: "GORM 이란?"
                      excerpt: "GORM"
                      thumbnail: "https://example.com/thumbnail.png"
                      publishedAt: "2026-05-13T15:08:25.030944+09:00"
                      updatedAt: "2026-05-13T15:08:25.032172+09:00"
                      category: null
                      tags: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Admin]
      summary: 게시물 생성
      operationId: createPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, title, content]
              properties:
                slug:
                  type: string
                  maxLength: 150
                title:
                  type: string
                  maxLength: 100
                content:
                  type: string
                  maxLength: 100000
                thumbnail:
                  type: string
                  nullable: true
                  maxLength: 2048
                categoryId:
                  type: integer
                  nullable: true
                tagSlugs:
                  type: array
                  items:
                    type: string
                  maxItems: 50
                isPrivate:
                  type: boolean
                  default: false
            example:
              slug: "go_learning_1"
              title: "GORM 이란?"
              content: "GORM"
              thumbnail: "https://example.com/thumbnail.png"
              categoryId: 13
              tagSlugs:
                - "gorm"
                - "reading"
              isPrivate: false
      responses:
        '201':
          description: 게시물 생성 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/PostPublic'
              example:
                status: 201
                code: "E201_001"
                detail: "Successfully added columns to 'go_learning_1' post."
                message: "리소스가 성공적으로 생성되었습니다."
                timestamp: "2026-05-13T05:37:24.728783333Z"
                path: "/api/v1/post"
                result:
                  id: 7
                  nickname: "admin"
                  slug: "go_learning_1"
                  title: "GORM 이란?"
                  excerpt: "GORM은 Go 언어에서 사용하는 ORM(Object Relational Mapping) 라이브러리입니다."
                  thumbnail: "https://example.com/thumbnail.png"
                  publishedAt: "2026-05-13T05:37:24.71177312Z"
                  updatedAt: "2026-05-13T14:37:24.712436929+09:00"
                  category:
                    id: 13
                    parentId: 5
                    path: "/tech/backend/go"
                    name: "Go"
                    slug: "go"
                  tags:
                    - id: 9
                      name: "독서"
                      slug: "reading"
                    - id: 11
                      name: "GORM"
                      slug: "gorm"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/post/{slug}:
    get:
      tags: [Public]
      summary: 개별 게시물 조회
      operationId: getPostBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 게시물 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/PostDetailPublic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/post/admin:
    get:
      tags: [Admin]
      summary: 관리자용 게시물 목록 조회
      operationId: getPostsAdmin
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/QueryPage'
        - $ref: '#/components/parameters/QueryPageLimit'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [id, created_at, updated_at, published_at, title, slug]
            default: created_at
        - $ref: '#/components/parameters/QuerySortDir'
        - $ref: '#/components/parameters/QueryPostId'
        - $ref: '#/components/parameters/QueryAccountId'
