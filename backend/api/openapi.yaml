                      publishedAt: "2026-03-20T16:46:58.119426+09:00"
                      category:
                        id: 29
                        parentId: 19
                        path: "/life/travel/overseas/japan"
                        name: "일본"
                        slug: "japan"
                      tags:
                        - id: 10
                          name: "여행기"
                          slug: "travel-log"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Admin]
      summary: 게시물 생성
      operationId: createPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, title, content]
              properties:
                slug:
                  type: string
                  maxLength: 150
                title:
                  type: string
                  maxLength: 100
                content:
                  type: string
                  maxLength: 100000
                thumbnail:
                  type: string
                  nullable: true
                  maxLength: 2048
                categoryId:
                  type: integer
                  nullable: true
                tagSlugs:
                  type: array
                  items:
                    type: string
                  maxItems: 50
                isPrivate:
                  type: boolean
                  default: false
            example:
              slug: "go_learning_1"
              title: "GORM 이란?"
              content: "GORM"
              thumbnail: "https://example.com/thumbnail.png"
              categoryId: 13
              tagSlugs:
                - "gorm"
                - "reading"
              isPrivate: false
      responses:
        '201':
          description: 게시물 생성 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/PostPublic'
              example:
                status: 201
                code: "E201_001"
                detail: "Successfully added columns to 'post' post."
                message: "리소스가 성공적으로 생성되었습니다."
                timestamp: "2026-05-20T04:36:50.135738518Z"
                path: "/api/v1/post"
                result:
                  id: 7
                  nickname: "admin"
                  accountId: "admin"
                  slug: "post"
                  title: "게시물 만들기"
                  excerpt: "게시물 만들기 테스트 이다."
                  thumbnail: "https://example.com/thumbnail.png"
                  isPrivate: false
                  createdAt: "2026-05-20T13:36:50.120752971+09:00"
                  updatedAt: "2026-05-20T13:36:50.120752971+09:00"
                  publishedAt: "2026-05-20T04:36:50.120078202Z"
                  category:
                    id: 13
                    parentId: 5
                    path: "/tech/backend/go"
                    name: "Go"
                    slug: "go"
                  tags:
                    - id: 9
                      name: "독서"
                      slug: "reading"
                    - id: 11
                      name: "GORM"
                      slug: "gorm"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/post/{slug}:
    get:
      tags: [Public]
      summary: 개별 게시물 조회
      operationId: getPostBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 게시물 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/PostDetail'
              example:
                status: 200
                code: "E200_001"
                detail: "Successfully retrieved id:59 'css-grid-layout' post."
                message: "정상적으로 처리되었습니다."
                timestamp: "2026-05-20T03:38:57.867474447Z"
                path: "/api/v1/post/css-grid-layout"
                result:
                  id: 59
                  nickname: "Editor"
                  slug: "css-grid-layout"
                  title: "CSS Grid 레이아웃 완전 가이드"
                  excerpt: "## grid-template-areas\\n직관적인 네이밍으로 복잡한 레이아웃을 구성합니다.\\n\\n```css\\n.container {\\n    display: grid;\\n    grid-template-areas:\\n        \"header header\"\\n  "
                  thumbnail: null
                  isPrivate: false
                  createdAt: "2026-05-19T16:46:58.029826+09:00"
