# TODO 각 엔드포인트 요청, 응답 Example 최신화

openapi: 3.0.3
info:
  title: Fieldnotes Blog API
  version: 1.0.0
  description: 블로그 사용자/관리자 API v1

servers:
  - url: http://{SERVER_URL}:8080/
    variables:
      SERVER_URL:
        default: localhost

tags:
  - name: Healthcheck
  - name: Public
  - name: Admin

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    OK:
      description: 성공
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonResponse'

    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            code: "E404_001"
            detail: "resource not found."
            message: "요청한 리소스를 찾을 수 없습니다."
            timestamp: "2025-12-26T01:34:00+09:00"
            path: "/api/v1/..."

    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            code: "E400_002"
            detail: "'AccountID' does not satisfy 'required' condition"
            message: "요청 파라미터의 타입 또는 형식이 올바르지 않습니다."
            timestamp: "2026-05-05T11:40:38.485176711Z"
            path: "/api/v1/..."

    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 401
            code: "E401_001"
            detail: "Invalid admin credentials."
            message: "인증에 실패하였습니다."
            timestamp: "2025-12-26T01:34:00+09:00"
            path: "/api/v1/..."

    Conflict:
      description: 리소스 중복
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 409
            code: "E409_001"
            detail: "resource already exists."
            message: "서버의 현재 상태와 요청이 충돌하였습니다."
            timestamp: "2025-12-26T01:34:00+09:00"
            path: "/api/v1/..."

    InternalServerError:
      description: 서버 내부 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 500
            code: "E500_001"
            detail: "failed to encode args[0]..."
            message: "서버 내부 에러가 발생하였습니다."
            timestamp: "2026-05-06T02:57:20.333687031Z"
            path: "/api/v1/..."

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: integer

    PathAccount:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        default: testAccount1
      description: 관리자 계정 ID

    QueryPage:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1

    QueryPageLimit:
      name: pageLimit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 8

    QueryPostId:
      name: id
      in: query
      schema:
        type: integer
        minimum: 1

    QueryAccountId:
      name: accountId
      in: query
      schema:
        type: string
        maxLength: 255

    QueryNickname:
      name: nickname
      in: query
      schema:
        type: string
        maxLength: 255

    QueryMatchType:
      name: matchType
      in: query
      schema:
        type: string
        enum: [equal, prefix, suffix, contains]
      description: slug/title 검색 방식 (slug 또는 title 사용 시 기본값 equal)

    QuerySlug:
      name: slug
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 150

    QueryTitle:
      name: title
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 100

    QueryCategoryId:
      name: categoryId
      in: query
      schema:
        type: integer
        format: int16
        minimum: 1

    QueryTagSlugs:
      name: tagSlugs
      in: query
      schema:
        type: array
        items:
          type: string
        maxItems: 50
      style: form
      explode: false

    QueryPostSortBy:
      name: sortBy
      in: query
      schema:
        type: string
        enum: [id, created_at, updated_at, published_at, title, slug]
        default: created_at

    QuerySortDir:
      name: sortDir
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc

    QueryDateFilter:
      name: dateFilter
      in: query
      schema:
        type: string
        enum: [eq, gt, lt, gte, lte, between]
      description: 날짜 비교 연산자. dateTarget/dateFrom과 함께 사용 (기본값 eq)

    QueryDateTarget:
      name: dateTarget
      in: query
      schema:
        type: string
        enum: [created_at, updated_at, published_at]
      description: 날짜 필터 대상 컬럼

    QueryDateFrom:
      name: dateFrom
      in: query
      schema:
        type: string
        format: date
      description: 날짜 필터 시작값 (YYYY-MM-DD)

    QueryDateTo:
      name: dateTo
      in: query
      schema:
        type: string
        format: date
      description: dateFilter=between 일 때 종료 날짜 (YYYY-MM-DD)

  schemas:
    CommonResponse:
      type: object
      required: [status, code, detail, message, timestamp, path]
      properties:
        status:
          type: integer
          example: 200
        code:
          type: string
          example: "E200_001"
        detail:
          type: string
          example: "Successfully retrieved."
        message:
          type: string
          example: "정상적으로 처리되었습니다."
        timestamp:
          type: string
          format: date-time
          example: "2026-01-20T16:31:00+09:00"
        path:
          type: string
          example: "/api/v1/post"

    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/CommonResponse'

    Pagination:
      type: object
      required: [page, pageLimit, total, totalPages, hasNextPage, hasPrevPage]
      properties:
        page:
          type: integer
          example: 1
        pageLimit:
          type: integer
          example: 8
        total:
          type: integer
          example: 3
        totalPages:
          type: integer
          example: 1
        hasNextPage:
          type: boolean
        hasPrevPage:
          type: boolean

    Sort:
      type: object
      required: [by, dir]
      properties:
        by:
          type: string
          example: "created_at"
        dir:
          type: string
          enum: [asc, desc]
          example: "desc"

    Diff:
      type: object
      required: [changedFields]
      properties:
        changedFields:
          type: array
          items:
            type: string
          example: ["name", "slug"]

    TagPublic:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: "태그1"
        slug:
          type: string
          example: "tag-1"

    TagDetail:
      type: object
      required: [id, name, slug, createdAt, updatedAt]
      properties:
        id:
          type: integer
          example: 12
        name:
          type: string
          example: "태그 12"
        slug:
          type: string
          example: "tag-12"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CategoryPublic:
      type: object
      required: [id, parentId, name, slug, path]
      nullable: true
      properties:
        id:
          type: integer
          example: 2
        parentId:
          type: integer
          nullable: true
          example: 1
        name:
          type: string
          example: "개발"
        slug:
          type: string
          example: "development"
        path:
          type: string
          example: "/tech/frontend"

    CategoryDetail:
      type: object
      required: [id, parentId, name, slug, path, createdAt, updatedAt]
      properties:
        id:
          type: integer
          example: 5
        parentId:
          type: integer
          nullable: true
          example: 2
        name:
          type: string
          example: "C++"
        slug:
          type: string
          example: "cpp"
        path:
          type: string
          example: "/cpp"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PostPublic:
      type: object
      required: [id, nickname, slug, title, excerpt, thumbnail, isPrivate, createdAt, updatedAt, publishedAt, category, tags]
      properties:
        id:
          type: integer
          example: 7
        nickname:
          type: string
          example: "admin"
        accountId:
          type: string
          example: "admin"
          description: "관리자 응답에만 포함 (omitempty)"
        slug:
          type: string
          example: "go_learning_1"
        title:
          type: string
          example: "GORM 이란?"
        excerpt:
          type: string
          example: "GORM은 Go 언어에서 사용하는 ORM..."
        thumbnail:
          type: string
          nullable: true
          example: "https://example.com/thumbnail.png"
        isPrivate:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          nullable: true
        category:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CategoryPublic'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagPublic'

    PostDetail:
      allOf:
        - $ref: '#/components/schemas/PostPublic'
        - type: object
          required: [content]
          properties:
            content:
              type: string

    AccountDetail:
      type: object
      required: [id, accountId, nickname, role, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
          example: 5
        accountId:
          type: string
          example: "admin"
        nickname:
          type: string
          example: "admin"
        avatarUrl:
          type: string
          nullable: true
          example: "https://www.svgrepo.com/show/345423/admin.svg"
        role:
          type: string
          enum: [USER, ADMIN]
          example: "ADMIN"
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
          example: "ACTIVE"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AccountPublic:
      type: object
      required: [id, accountId, role, status]
      properties:
        id:
          type: integer
          example: 5
        accountId:
          type: string
          example: "admin"
        nickname:
          type: string
          example: "관리자"
        avatarUrl:
          type: string
          nullable: true
          example: "https://example.com/avatar.png"
        role:
          type: string
          enum: [USER, ADMIN]
          example: "ADMIN"
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
          example: "ACTIVE"
          
    ImageResponse:
      type: object
      required: [url, filename]
      properties:
        url:
          type: string
          example: "/api/v1/static/a1b2c3d4e5f6.png"
        filename:
          type: string
          example: "a1b2c3d4e5f6.png"

paths:

  /api/v1/health:
    get:
      tags: [Healthcheck]
      summary: 서버 헬스체크
      operationId: healthCheck
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: "OK"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/post:
    get:
      tags: [Public]
      summary: 게시물 목록 조회
      operationId: getPosts
      parameters:
        - $ref: '#/components/parameters/QueryPage'
        - $ref: '#/components/parameters/QueryPageLimit'
        - $ref: '#/components/parameters/QueryPostSortBy'
        - $ref: '#/components/parameters/QuerySortDir'
        - $ref: '#/components/parameters/QueryPostId'
        - $ref: '#/components/parameters/QueryNickname'
        - $ref: '#/components/parameters/QueryMatchType'
        - $ref: '#/components/parameters/QuerySlug'
        - $ref: '#/components/parameters/QueryTitle'
        - $ref: '#/components/parameters/QueryCategoryId'
        - $ref: '#/components/parameters/QueryTagSlugs'
        - $ref: '#/components/parameters/QueryDateFilter'
        - $ref: '#/components/parameters/QueryDateTarget'
        - $ref: '#/components/parameters/QueryDateFrom'
        - $ref: '#/components/parameters/QueryDateTo'
      responses:
        '200':
          description: 게시물 목록 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      result:
                        type: object
                        properties:
                          meta:
                            type: object
                            properties:
                              pagination:
                                $ref: '#/components/schemas/Pagination'
                              sort:
                                $ref: '#/components/schemas/Sort'
                              filter:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    nullable: true
                                  nickname:
                                    type: string
                                    nullable: true
                                  matchType:
                                    type: string
                                    nullable: true
                                  slug:
                                    type: string
                                    nullable: true
                                  title:
                                    type: string
                                    nullable: true
                                  categoryId:
                                    type: integer
                                    nullable: true
                                  tagSlugs:
                                    type: array
                                    nullable: true
                                    items:
                                      type: string
                                  dateFilter:
                                    type: string
                                    nullable: true
                                  dateTarget:
                                    type: string
                                    nullable: true
                                  dateFrom:
                                    type: string
                                    format: date
                                    nullable: true
                                  dateTo:
                                    type: string
                                    format: date
                                    nullable: true
                          data:
                            type: array
                            items:
                              $ref: '#/components/schemas/PostPublic'
              example:
                status: 200
                code: "E200_001"
                detail: "Successfully retrieved 3 posts."
                message: "정상적으로 처리되었습니다."
                timestamp: "2026-05-20T03:19:37.62046324Z"
                path: "/api/v1/post"
                result:
                  meta:
                    pagination:
                      page: 1
                      pageLimit: 8
                      total: 3
                      totalPages: 1
                      hasNextPage: false
                      hasPrevPage: false
                    sort:
                      by: "created_at"
                      dir: "desc"
                    filter:
                      match:
                        matchType: "prefix"
                        id: null
                        nickname: null
                        slug: "japan"
                        title: null
                        categoryId: null
                        tagSlugs: null
                        isPrivate: false
                      date:
                        dateFilter: "between"
                        dateTarget: "created_at"
                        dateFrom: "2026-05-19"
                        dateTo: "2026-05-20"
                  data:
                    - id: 69
                      nickname: "Editor"
