                      excerpt: "## 도쿄 3박 4일\\n처음 방문한 일본은 정말 인상적이었습니다. 아사쿠사, 시부야, 신주쿠를 돌아보며 일본의 매력을 느꼈습니다."
                      thumbnail: "https://img.example.com/japan.png"
