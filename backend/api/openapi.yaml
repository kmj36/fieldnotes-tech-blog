openapi: 3.0.3
info:
  title: Fieldnotes Blog API
  version: 1.0.0
  description: 블로그 사용자/관리자 API v1

servers:
  - url: http://{SERVER_URL}:8080/
    variables:
      SERVER_URL:
        default: localhost

tags:
  - name: Healthcheck
  - name: Public
  - name: Admin

# ────────────────────────────────────────────
# Components
# ────────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ── 공통 응답 ──────────────────────────────
  responses:
    OK:
      description: 성공
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonResponse'

    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            code: "E404_001"
            detail: "resource not found."
            message: "요청한 리소스를 찾을 수 없습니다."
            timestamp: "2025-12-26T01:34:00+09:00"
            path: "/api/v1/..."

    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            code: "E400_002"
            detail: "'AccountID' does not satisfy 'required' condition"
            message: "요청 파라미터의 타입 또는 형식이 올바르지 않습니다."
            timestamp: "2026-05-05T11:40:38.485176711Z"
            path: "/api/v1/..."

    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 401
            code: "E401_001"
            detail: "Invalid admin credentials."
            message: "인증에 실패하였습니다."
            timestamp: "2025-12-26T01:34:00+09:00"
            path: "/api/v1/..."

    Conflict:
      description: 리소스 중복
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 409
            code: "E409_001"
            detail: "resource already exists."
            message: "서버의 현재 상태와 요청이 충돌하였습니다."
            timestamp: "2025-12-26T01:34:00+09:00"
            path: "/api/v1/..."

    InternalServerError:
      description: 서버 내부 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 500
            code: "E500_001"
            detail: "failed to encode args[0]..."
            message: "서버 내부 에러가 발생하였습니다."
            timestamp: "2026-05-06T02:57:20.333687031Z"
            path: "/api/v1/..."

  # ── 재사용 파라미터 ───────────────────────────
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: integer

    PathAccount:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        default: testAccount1
      description: 관리자 계정 ID

    QueryPage:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1

    QueryPageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 8

    QuerySearch:
      name: search
      in: query
      schema:
        type: string
        maxLength: 100

    QueryCategorySlug:
      name: categorySlug
      in: query
      schema:
        type: string
        maxLength: 100

    QueryTagSlugs:
      name: tagSlugs
      in: query
      schema:
        type: array
        items:
          type: string
        maxItems: 50
      style: form
      explode: false

    QuerySortBy:
      name: sortBy
      in: query
      schema:
        type: string
        enum: [createdAt, title, excerpt]
        default: createdAt

    QuerySortDir:
      name: sortDir
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc

  # ── 스키마 ────────────────────────────────
  schemas:
    # ── 공통 ──────────────────────────────────
    CommonResponse:
      type: object
      required: [status, code, detail, message, timestamp, path]
      properties:
        status:
          type: integer
          example: 200
        code:
          type: string
          example: "E200_001"
        detail:
          type: string
          example: "Successfully retrieved."
        message:
          type: string
          example: "정상적으로 처리되었습니다."
        timestamp:
          type: string
          format: date-time
          example: "2026-01-20T16:31:00+09:00"
        path:
          type: string
          example: "/api/v1/posts"

    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/CommonResponse'

    Pagination:
      type: object
      required: [page, pageSize, total, totalPages, hasNextPage, hasPrevPage]
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 8
        total:
          type: integer
          example: 3
        totalPages:
          type: integer
          example: 1
        hasNextPage:
          type: boolean
        hasPrevPage:
          type: boolean

    Sort:
      type: object
      required: [by, dir]
      properties:
        by:
          type: string
          example: "createdAt"
        dir:
          type: string
          enum: [asc, desc]
          example: "desc"

    Diff:
      type: object
      required: [changed_fields]
      properties:
        changed_fields:
          type: array
          items:
            type: string
          example: ["name", "slug"]

    # ── 태그 ──────────────────────────────────
    TagPublic:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: "태그1"
        slug:
          type: string
          example: "tag-1"

    TagDetail:
      type: object
      required: [id, name, slug, createdAt, updatedAt]
      properties:
        id:
          type: integer
          example: 12
        name:
          type: string
          example: "태그 12"
        slug:
          type: string
          example: "tag-12"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── 카테고리 ──────────────────────────────
    CategoryPublic:
      type: object
      required: [id, parentId, name, slug, path]
      nullable: true
      properties:
        id:
          type: integer
          example: 2
        parentId:
          type: integer
          nullable: true
          example: 1
        name:
          type: string
          example: "개발"
        slug:
          type: string
          example: "development"
        path:
          type: string
          example: "/tech/frontend"

    CategoryDetail:
      type: object
      required: [id, parentId, name, slug, path, createdAt, updatedAt]
      properties:
        id:
          type: integer
          example: 5
        parentId:
          type: integer
          nullable: true
          example: 2
        name:
          type: string
          example: "C++"
        slug:
          type: string
          example: "cpp"
        path:
          type: string
          example: "/cpp"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── 게시물 ────────────────────────────────
    PostSummaryPublic:
      type: object
      required: [id, slug, title, excerpt, thumbnail, createdAt, updatedAt, category, tags]
      properties:
        id:
          type: integer
          example: 1
        slug:
          type: string
          example: "example-my-blog-1"
        title:
          type: string
          example: "제목1"
        excerpt:
          type: string
          example: "내용 요약 1"
        thumbnail:
          type: string
          nullable: true
          example: "https://img.example.com/test.png"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        category:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CategoryPublic'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagPublic'

    PostDetailPublic:
      type: object
      required: [id, slug, title, content, thumbnail, createdAt, updatedAt, category, tags]
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        content:
          type: string
        thumbnail:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        category:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CategoryPublic'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagPublic'

    PostSummaryAdmin:
      allOf:
        - $ref: '#/components/schemas/PostSummaryPublic'
        - type: object
          required: [updatedAt, isPublish, isPrivate]
          properties:
            updatedAt:
              type: string
              format: date-time
            category:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/CategoryDetail'
            isPublish:
              type: boolean
            isPrivate:
              type: boolean

    PostDetailAdmin:
      type: object
      required: [id, slug, title, content, thumbnail, createdAt, updatedAt, isPublish, isPrivate, category, tags]
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        content:
          type: string
        thumbnail:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        isPublish:
          type: boolean
        isPrivate:
          type: boolean
        category:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CategoryDetail'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagPublic'

    # ── 계정 ──────────────────────────────────
    AccountDetail:
      type: object
      required: [id, accountId, nickname, avatarUrl, role, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
          example: 5
        accountId:
          type: string
          example: "admin"
        nickname:
          type: string
          example: "admin"
        avatarUrl:
          type: string
          example: "https://www.svgrepo.com/show/345423/admin.svg"
        role:
          type: string
          example: "ADMIN"
        status:
          type: string
          example: "ACTIVE"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AccountPublic:
      type: object
      required: [id, accountId, role]
      properties:
        id:
          type: integer
          example: 5
        accountId:
          type: string
          example: "admin"
        nickname:
          type: string
          example: "관리자"
        avatarUrl:
          type: string
          example: "https://example.com/avatar.png"
        role:
          type: string
          example: "ADMIN"
        status:
          type: string
          example: "ACTIVE"

# ────────────────────────────────────────────
# Paths
# ────────────────────────────────────────────
paths:

  # ── Healthcheck ───────────────────────────
  /api/v1/health:
    get:
      tags: [Healthcheck]
      summary: 서버 헬스체크
      operationId: healthCheck
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: "OK"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ── 게시물 ────────────────────────────────
  /api/v1/posts:
    get:
      tags: [Public]
      summary: 게시물 목록 조회
      operationId: getPosts
      parameters:
        - $ref: '#/components/parameters/QueryPage'
        - $ref: '#/components/parameters/QueryPageSize'
        - $ref: '#/components/parameters/QuerySearch'
        - $ref: '#/components/parameters/QueryCategorySlug'
        - $ref: '#/components/parameters/QueryTagSlugs'
        - $ref: '#/components/parameters/QuerySortBy'
        - $ref: '#/components/parameters/QuerySortDir'
      responses:
        '200':
          description: 게시물 목록 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      result:
                        type: object
                        properties:
                          meta:
                            type: object
                            properties:
                              pagination:
                                $ref: '#/components/schemas/Pagination'
                              sort:
                                $ref: '#/components/schemas/Sort'
                              filters:
                                type: object
                                properties:
                                  search:
                                    type: string
                                    nullable: true
                                  categorySlug:
                                    type: string
                                    nullable: true
                                  tagSlugs:
                                    type: array
                                    items:
                                      type: string
                          data:
                            type: array
                            items:
                              $ref: '#/components/schemas/PostSummaryPublic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Admin]
      summary: 게시물 생성
      operationId: createPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, title, content]
              properties:
                slug:
                  type: string
                  maxLength: 150
                title:
                  type: string
                  maxLength: 100
                content:
                  type: string
                  maxLength: 100000
                thumbnail:
                  type: string
                  nullable: true
                  maxLength: 2048
                categoryId:
                  type: integer
                  nullable: true
                tagIds:
                  type: array
                  items:
                    type: integer
                  maxItems: 50
                isPublish:
                  type: boolean
                  default: true
                isPrivate:
                  type: boolean
                  default: false
      responses:
        '201':
          description: 게시물 생성 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/PostDetailAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/posts/{slug}:
    get:
      tags: [Public]
      summary: 개별 게시물 조회
      operationId: getPostBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 게시물 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/PostDetailPublic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/posts/admin:
    get:
      tags: [Admin]
      summary: 관리자용 게시물 목록 조회
      operationId: getPostsAdmin
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/QueryPage'
        - $ref: '#/components/parameters/QueryPageSize'
        - $ref: '#/components/parameters/QuerySearch'
        - $ref: '#/components/parameters/QueryCategorySlug'
        - $ref: '#/components/parameters/QueryTagSlugs'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [createdAt, updatedAt, title, excerpt]
            default: createdAt
        - $ref: '#/components/parameters/QuerySortDir'
        - name: isPublish
          in: query
          schema:
            type: boolean
            default: true
        - name: isPrivate
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 관리자 게시물 목록 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      result:
                        type: object
                        properties:
                          meta:
                            type: object
                            properties:
                              pagination:
                                $ref: '#/components/schemas/Pagination'
                              sort:
                                $ref: '#/components/schemas/Sort'
                              filters:
                                type: object
                                properties:
                                  search:
                                    type: string
                                    nullable: true
                                  categorySlug:
                                    type: string
                                    nullable: true
                                  tagSlugs:
                                    type: array
                                    items:
                                      type: string
                                  isPublish:
                                    type: boolean
                                  isPrivate:
                                    type: boolean
                          data:
                            type: array
                            items:
                              $ref: '#/components/schemas/PostSummaryAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/posts/{id}:
    patch:
      tags: [Admin]
      summary: 게시물 수정
      operationId: updatePost
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slug:
                  type: string
                  maxLength: 150
                title:
                  type: string
                  maxLength: 100
                content:
                  type: string
                  maxLength: 100000
                thumbnail:
                  type: string
                  nullable: true
                  maxLength: 2048
                categoryId:
                  type: integer
                  nullable: true
                tagIds:
                  type: array
                  items:
                    type: integer
                  maxItems: 50
                isPublish:
                  type: boolean
                isPrivate:
                  type: boolean
      responses:
        '200':
          description: 게시물 수정 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      result:
                        type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/PostDetailAdmin'
                          diff:
                            $ref: '#/components/schemas/Diff'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Admin]
      summary: 게시물 삭제
      operationId: deletePost
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ── 카테고리 ──────────────────────────────
  /api/v1/category:
    get:
      tags: [Public]
      summary: 카테고리 목록 조회
      operationId: getCategories
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [id, parent_id, name, slug]
            default: id
        - $ref: '#/components/parameters/QuerySortDir'
        - name: id
          in: query
          schema:
            type: integer
            format: int16
        - name: parentId
          in: query
          schema:
            type: integer
            format: int16
            nullable: true
        - name: name
          in: query
          schema:
            type: string
        - name: slug
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 카테고리 목록 조회 성공
          content:
            application/json:
              example:
                status: 200
                code: "E200_001"
                detail: "Successfully retrieved categories."
                message: "정상적으로 처리되었습니다."
                timestamp: "2026-05-05T08:22:08.148673804Z"
                path: "/api/v1/category"
                result:
                  meta:
                    sort:
                      by: "id"
                      dir: "desc"
                    limit: 10
                    filters:
                      id: null
                      parentId: null
                      name: null
                      slug: "europe"
                  data:
                    - id: 30
                      parentId: 19
                      name: "유럽"
                      slug: "europe"
                      path: "/life/travel/overseas/europe"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Admin]
      summary: 카테고리 생성
      operationId: createCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                parentId:
                  type: integer
                  nullable: true
                  default: null
                name:
                  type: string
                  maxLength: 100
                slug:
                  type: string
                  maxLength: 150
      responses:
        '201':
          description: 카테고리 생성 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/CategoryDetail'
              example:
                status: 201
                code: "E201_001"
                detail: "Category '테스트2' created Successfully."
                message: "리소스가 성공적으로 생성되었습니다."
                timestamp: "2026-05-07T08:26:02.045722981Z"
                path: "/api/v1/category"
                result:
                  id: 33
                  parentId: 1
                  path: "/tech/test2"
                  name: "테스트2"
                  slug: "test2"
                  createdAt: "2026-05-07T17:26:02.038725893+09:00"
                  updatedAt: "2026-05-07T17:26:02.038725893+09:00"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
