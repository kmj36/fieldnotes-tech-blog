name: Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and analyze
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # ── 테스트 커버리지 비활성화 ──────────────────────────
      # - name: Run Go tests with coverage
      #   working-directory: backend
      #   run: go test -coverprofile=coverage.out ./...

      - uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


      - uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy-staging:
    name: Deploy to staging
    needs: build
    runs-on: [self-hosted, test-server]
    if: startsWith(github.ref, 'refs/heads/release/')

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Create env file from secret
        run: |
          mkdir -p infra/env
          echo "$ENV_STAGING" > infra/env/.env.staging
        env:
          ENV_STAGING: ${{ secrets.ENV_STAGING }}

      - name: Deploy staging
        run: bash scripts/docker_staging_up.sh

  deploy-prod:
    name: Deploy to production
    needs: build
    runs-on: [self-hosted, main-server]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Create env file from secret
        run: |
          mkdir -p infra/env
          echo "$ENV_PROD" > infra/env/.env.prod
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}

      - name: Deploy production
        run: bash scripts/docker_prod_up.sh