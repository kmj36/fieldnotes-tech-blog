version: '3.8'

services:
  fieldnotes_nginx:
    build:
      context: ../../
      dockerfile: infra/docker/frontend/Dockerfile
    restart: unless-stopped
    volumes:
      - ../docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/fieldnotes:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD", "wget", "qO-", "https://localhost"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      - fieldnotes_backend

  fieldnotes_backend:
    build:
      context: ../../
      dockerfile: infra/docker/backend/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${API_PORT}/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      fieldnotes_postgres:
        condition: service_healthy # postgres healthy 후 시작
      fieldnotes_migrate:
        condition: service_completed_successfully # migrate 완료 후 시작

  fieldnotes_postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  fieldnotes_migrate:
    image: migrate/migrate:latest
    restart: "no"
    depends_on:
      fieldnotes_postgres:
        condition: service_healthy
    command: ["-path", "/migrations", "-database", "${DB_SCHEME}://${DB_USER}:${DB_PASSWORD}@${DB_DOCKER_HOST}:${DB_PORT}/${DB_DATABASE}?sslmode=${DB_SSLMODE}", "up"]
    volumes:
      - ../../migrations:/migrations